# Fonti del daily digest. `type: reddit` usa l'API con OAuth se REDDIT_CLIENT_ID/SECRET sono impostate, altrimenti il feed RSS.
# `ranked: true` = l'ordine del feed è già una classifica (es. Reddit top).
sources:
  - { name: "r/LocalLLaMA", type: reddit, subreddit: LocalLLaMA }
  - { name: "r/LocalLLM", type: reddit, subreddit: LocalLLM }
  - { name: "r/AI_Agents", type: reddit, subreddit: AI_Agents }
  - { name: "r/MachineLearning", type: reddit, subreddit: MachineLearning }
  - { name: "Hacker News",      type: feed, ranked: false, url: "https://hnrss.org/newest?q=ollama+OR+llama.cpp+OR+%22local+llm%22&points=40" }
  - { name: "Hugging Face",     type: feed, ranked: false, url: "https://huggingface.co/blog/feed.xml" }
  - { name: "Simon Willison",   type: feed, ranked: false, url: "https://simonwillison.net/atom/everything/" }
  # Release ufficiali = notizie vere. Le pre-release (-rc) sono escluse dall'URL.
  - { name: "Ollama releases",  type: feed, url: "https://github.com/ollama/ollama/releases.atom", title_prefix: "Ollama ", boost: 3, exclude_url: "-(rc|alpha|beta)" }
  # La ricerca per topic porta molto rumore: soglia alta, topic mirati.
  - { name: "GitHub",           type: github, topics: [ollama, llama-cpp, local-llm], days: 7, min_stars: 150 }

# Punteggio di rilevanza: parola trovata in titolo/testo = peso. `avoid` = penalità (-5).
# Sotto `min_score` il contenuto viene scartato: meglio meno voci che voci inutili.
ranking:
  min_score: 2
  keywords:
    ollama: 3
    llama.cpp: 3
    gguf: 2
    quantiz: 2
    "local llm": 2
    locally: 1
    "on-device": 1
    cpu: 1
    agent: 1
    mcp: 2
    ruby: 2
    qwen: 2
    gemma: 2
    embedding: 1
    rag: 1
    open-source: 1
    benchmark: 1
  avoid:
    - sponsored
    - webinar
    - "sign up"
    - discount
    - "% off"
    - "we're hiring"
