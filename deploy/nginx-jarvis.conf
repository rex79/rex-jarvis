# Jarvis sulla rete di casa senza numeri di porta.
#   http://192.168.2.26     → rimanda a https (il microfono del tablet funziona solo in https)
#   https://192.168.2.26/   → dashboard Jarvis (HUD, porta 7777)
#   https://192.168.2.26/digest/ → digest e pagina Finanza (dashboard servizi, porta 8080)
# Il certificato è quello che Jarvis ha già creato in ~/.jarvis.
# Installazione: deploy/installa-nginx.sh

# L'HUD accetta solo Origin "https://host:7777": quelli dalla porta 443 vengono riscritti con la sua
# porta. Un Origin estraneo resta estraneo (evil.com → evil.com:7777) e l'HUD lo rifiuta comunque.
map $http_origin $jarvis_origin {
    ~^(https://[^:/]+)$  $1:7777;
    default              $http_origin;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /home/rex/.jarvis/hud_cert.pem;
    ssl_certificate_key /home/rex/.jarvis/hud_key.pem;

    client_max_body_size 3m;   # l'audio della voce arriva fino a 2 MB
    proxy_read_timeout   300s; # il modello locale a volte ci mette un po'

    location = /digest { return 301 /digest/; }
    location /digest/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass https://127.0.0.1:7777;
        proxy_ssl_verify off;   # è lo stesso Mac mini
        proxy_set_header Host   $host:7777;   # l'HUD controlla nome e porta
        proxy_set_header Origin $jarvis_origin;
        proxy_buffering off;
    }
}
