# Fonti del daily digest. `ranked: true` = l'ordine del feed è già una classifica (es. Reddit top).
sources:
  - { name: "r/LocalLLaMA",     type: feed, ranked: true, url: "https://www.reddit.com/r/LocalLLaMA/top/.rss?t=day" }
  - { name: "r/LocalLLM",       type: feed, ranked: true, url: "https://www.reddit.com/r/LocalLLM/top/.rss?t=day" }
  - { name: "r/AI_Agents",      type: feed, ranked: true, url: "https://www.reddit.com/r/AI_Agents/top/.rss?t=day" }
  - { name: "r/MachineLearning", type: feed, ranked: true, url: "https://www.reddit.com/r/MachineLearning/top/.rss?t=day" }
  - { name: "Hacker News",      type: feed, ranked: false, url: "https://hnrss.org/newest?q=ollama+OR+llama.cpp+OR+%22local+llm%22&points=40" }
  - { name: "Hugging Face",     type: feed, ranked: false, url: "https://huggingface.co/blog/feed.xml" }
  - { name: "Simon Willison",   type: feed, ranked: false, url: "https://simonwillison.net/atom/everything/" }
  - { name: "GitHub",           type: github, topics: [ollama, llm, ai-agents, mcp], days: 7, min_stars: 30 }

# Punteggio di rilevanza: parola trovata in titolo/testo = peso. `avoid` = penalità (-5).
# Sotto `min_score` il contenuto viene scartato: meglio meno voci che voci inutili.
ranking:
  min_score: 2
  keywords:
    ollama: 3
    llama.cpp: 3
    gguf: 2
    quantiz: 2
    "local llm": 2
    locally: 1
    "on-device": 1
    cpu: 1
    agent: 1
    mcp: 2
    ruby: 2
    qwen: 2
    gemma: 2
    embedding: 1
    rag: 1
    open-source: 1
    benchmark: 1
  avoid:
    - sponsored
    - webinar
    - "sign up"
    - discount
    - "% off"
    - "we're hiring"
